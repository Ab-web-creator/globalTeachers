name: teachernavigator-local
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teachernavigator
      POSTGRES_USER: teachernavigator
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run npm run db:setup first}
    ports:
      - "127.0.0.1:${LOCAL_DATABASE_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachernavigator -d teachernavigator"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
